name: CI
on:
  pull_request:
  push:
    branches: [dev, main]
jobs:
  html:
    name: html sin funcionalidad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/html-sin-funcionalidad.test.mjs
